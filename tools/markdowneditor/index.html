<style>
/* ============ 主题：跟随系统 ============ */
:root{
  --bg:#ffffff; --bg-subtle:#f6f8fa; --bg-inset:#eff1f3;
  --border:#d1d9e0; --border-muted:#d8dee4;
  --text:#1f2328; --text-secondary:#59636e; --text-tertiary:#818b98;
  --accent:#0969da; --accent-hover:#0860ca; --accent-bg:#ddf4ff;
  --code-bg:rgba(175,184,193,.2); --code-block-bg:#f6f8fa;
  --quote-color:#59636e; --table-stripe:#f6f8fa; --danger:#d1242f;
  --shadow:0 1px 0 rgba(31,35,40,.04),0 1px 3px rgba(31,35,40,.06);
  --gutter-bg:#f6f8fa; --gutter-text:#818b98;
  --sel-bg:#b6e3ff; --focus-ring:rgba(9,105,218,.35);
}
html[data-theme="dark"]{
  --bg:#0d1117; --bg-subtle:#161b22; --bg-inset:#010409;
  --border:#30363d; --border-muted:#21262d;
  --text:#c9d1d9; --text-secondary:#8b949e; --text-tertiary:#6e7681;
  --accent:#58a6ff; --accent-hover:#79b8ff; --accent-bg:rgba(56,139,253,.15);
  --code-bg:rgba(110,118,129,.4); --code-block-bg:#161b22;
  --quote-color:#8b949e; --table-stripe:#161b22; --danger:#f85149;
  --shadow:0 1px 0 rgba(1,4,9,.6),0 1px 3px rgba(1,4,9,.6);
  --gutter-bg:#0d1117; --gutter-text:#484f58;
  --sel-bg:rgba(56,139,253,.4); --focus-ring:rgba(56,139,253,.4);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0d1117; --bg-subtle:#161b22; --bg-inset:#010409;
    --border:#30363d; --border-muted:#21262d;
    --text:#c9d1d9; --text-secondary:#8b949e; --text-tertiary:#6e7681;
    --accent:#58a6ff; --accent-hover:#79b8ff; --accent-bg:rgba(56,139,253,.15);
    --code-bg:rgba(110,118,129,.4); --code-block-bg:#161b22;
    --quote-color:#8b949e; --table-stripe:#161b22; --danger:#f85149;
    --shadow:0 1px 0 rgba(1,4,9,.6),0 1px 3px rgba(1,4,9,.6);
    --gutter-bg:#0d1117; --gutter-text:#484f58;
    --sel-bg:rgba(56,139,253,.4); --focus-ring:rgba(56,139,253,.4);
  }
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
::selection{background:var(--sel-bg)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}

/* ============ 顶栏 ============ */
.topbar{
  display:flex; align-items:center; gap:8px;
  height:48px; padding:0 12px;
  background:var(--bg-subtle); border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.brand svg{width:24px;height:24px;fill:var(--text)}
.file-name{
  flex:1 1 auto; min-width:120px; max-width:360px;
  padding:4px 10px; border:1px solid transparent; border-radius:6px;
  background:transparent; font-size:13px; color:var(--text);
}
.file-name:hover{background:var(--bg-inset)}
.file-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.topbar .spacer{flex:1}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  height:30px; padding:0 10px; border-radius:6px;
  font-size:13px; color:var(--text);
  border:1px solid var(--border); background:var(--bg);
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-subtle);border-color:var(--border-muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn svg{width:16px;height:16px;fill:currentColor}
.theme-switch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg)}
.theme-switch button{height:30px;padding:0 8px;display:flex;align-items:center;color:var(--text-secondary)}
.theme-switch button.on{background:var(--accent-bg);color:var(--accent)}
.theme-switch button svg{width:15px;height:15px;fill:currentColor}

/* ============ 工具栏 ============ */
.toolbar{
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  padding:6px 12px; background:var(--bg); border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.tool{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:6px; color:var(--text-secondary);
}
.tool:hover{background:var(--bg-subtle);color:var(--text)}
.tool:active{background:var(--bg-inset)}
.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool .hlabel{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;stroke:none;fill:currentColor}
.sep{width:1px;height:20px;background:var(--border);margin:0 6px}

/* ============ 主区 ============ */
.main{flex:1 1 auto; display:flex; min-height:0; position:relative}
.pane{flex:1 1 50%; min-width:0; display:flex; flex-direction:column; min-height:0; overflow:hidden}
.pane.editor{border-right:1px solid var(--border)}
.pane-label{
  flex:0 0 auto; padding:6px 16px; font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:.06em; color:var(--text-tertiary);
  background:var(--bg); border-bottom:1px solid var(--border-muted);
}
.editor-wrap{flex:1; position:relative; overflow:hidden; background:var(--bg)}
.gutter{
  position:absolute; top:0; bottom:0; left:0; width:48px;
  background:var(--gutter-bg); border-right:1px solid var(--border-muted);
  padding:16px 8px 16px 0; text-align:right;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px; line-height:1.6; color:var(--gutter-text);
  user-select:none; overflow:hidden; pointer-events:none;
}
#editor{
  position:absolute; top:0; right:0; bottom:0; left:48px;
  width:calc(100% - 48px); padding:16px 16px 16px 16px;
  background:transparent; border:none; outline:none; resize:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px; line-height:1.6; color:var(--text);
  white-space:pre; overflow:auto; tab-size:2;
}
#editor::placeholder{color:var(--text-tertiary)}
.divider{
  flex:0 0 5px; cursor:col-resize; background:var(--border);
  transition:background .12s;
}
.divider:hover,.divider.drag{background:var(--accent)}
.preview-wrap{
  flex:1; overflow:auto; padding:32px 40px 80px; background:var(--bg);
}
#preview{max-width:900px;margin:0 auto}

/* ============ GitHub Markdown 渲染样式 ============ */
#preview{font-size:16px;line-height:1.6;color:var(--text);word-wrap:break-word}
#preview > *:first-child{margin-top:0!important}
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{
  margin:24px 0 16px; font-weight:600; line-height:1.25;
}
#preview h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
#preview h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
#preview h3{font-size:1.25em}
#preview h4{font-size:1em}
#preview h5{font-size:.875em}
#preview h6{font-size:.85em;color:var(--text-secondary)}
#preview p{margin:0 0 16px}
#preview a{color:var(--accent);text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview strong{font-weight:600}
#preview ul,#preview ol{margin:0 0 16px;padding-left:2em}
#preview ul{list-style:disc}
#preview ol{list-style:decimal}
#preview ul ul{list-style:circle;margin:0}
#preview ol ol{list-style:lower-roman;margin:0}
#preview li{margin:.25em 0}
#preview li > input[type=checkbox]{margin:0 .35em .25em -1.6em;vertical-align:middle}
#preview blockquote{
  margin:0 0 16px; padding:0 1em; color:var(--quote-color);
  border-left:.25em solid var(--border);
}
#preview blockquote > *{margin:.5em 0}
#preview code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:85%; padding:.2em .4em; border-radius:6px; background:var(--code-bg);
}
#preview pre{
  margin:0 0 16px; padding:16px; overflow:auto; font-size:85%; line-height:1.45;
  background:var(--code-block-bg); border-radius:6px;
}
#preview pre code{padding:0;background:transparent;font-size:100%}
#preview table{
  border-collapse:collapse; margin:0 0 16px; display:block; width:max-content; max-width:100%;
  overflow:auto;
}
#preview table th,#preview table td{padding:6px 13px;border:1px solid var(--border)}
#preview table th{font-weight:600;background:var(--bg-subtle)}
#preview table tr{background:var(--bg);border-top:1px solid var(--border-muted)}
#preview table tr:nth-child(2n){background:var(--table-stripe)}
#preview hr{height:.25em;padding:0;margin:24px 0;background-color:var(--border);border:0;border-radius:2px}
#preview img{max-width:100%;border-radius:6px}
#preview kbd{
  display:inline-block;padding:3px 5px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--text);vertical-align:middle;background:var(--bg-subtle);
  border:solid 1px var(--border);border-bottom-width:2px;border-radius:6px;
}

/* ============ 状态栏 ============ */
.statusbar{
  flex:0 0 28px; display:flex; align-items:center; gap:16px;
  padding:0 12px; font-size:12px; color:var(--text-secondary);
  background:var(--bg-subtle); border-top:1px solid var(--border);
}
.statusbar .item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.statusbar .spacer{flex:1}
.statusbar .sync{cursor:pointer;user-select:none}
.statusbar .sync:hover{color:var(--accent)}

/* ============ 移动端：单栏 tab ============ */
@media (max-width: 720px){
  .pane.editor{border-right:none;border-bottom:1px solid var(--border)}
  body.mode-split .pane.preview{display:none}
  body.mode-split .pane.editor{flex:1 1 auto}
  body.mode-preview .pane.editor{display:none}
  body.mode-preview .pane.preview{flex:1 1 auto}
  .divider{display:none}
  .preview-wrap{padding:20px}
  .topbar .btn .lbl{display:none}
}
@media (min-width: 721px){
  body.mode-mobile-only .pane.preview{display:none}
}

/* toast */
.toast{
  position:fixed; left:50%; bottom:48px; transform:translateX(-50%) translateY(20px);
  padding:8px 16px; border-radius:8px; background:var(--text); color:var(--bg);
  font-size:13px; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* print */
@media print{
  .topbar,.toolbar,.statusbar,.divider,.pane-label,.editor-wrap{display:none!important}
  .main,.preview-wrap{display:block;height:auto;overflow:visible;padding:0}
  #preview{max-width:none}
}
</style>

<script>
'use strict';
/* ============================================================
 *  GitHub 风格 Markdown 编辑器（单文件、零依赖）
 * ============================================================ */
const $ = (s) => document.querySelector(s);
const editor = $('#editor');
const preview = $('#preview');
const gutter = $('#gutter');
const previewScroll = $('#previewScroll');
const STORAGE_KEY = 'gh-md-editor:doc:v1';
const THEME_KEY = 'gh-md-editor:theme';

/* ---------------- 欢迎文档 ---------------- */
const WELCOME = `# 欢迎使用 Markdown 编辑器

这是一个 **GitHub 风格** 的在线编辑器，自动跟随你的系统明暗主题。左侧编写，右侧实时预览。

## 快捷键

| 操作 | 快捷键 |
| --- | --- |
| 加粗 | <kbd>Ctrl</kbd>+<kbd>B</kbd> |

| 行内代码 | <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd> |
| 链接 | <kbd>Ctrl</kbd>+<kbd>K</kbd> |

| 引用 | <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Q</kbd> |

## 支持的语法

- **加粗**、*斜体*、~~删除线~~、\`行内代码\`
- [链接](https://github.com) 和 ![图片](https://avatars.githubusercontent.com/u/9919?s=40)
- 无序列表
  - 嵌套项
  - 任务列表
- 有序列表
  1. 第一项
  2. 第二项

> 这是一段引用。引用可以包含 **Markdown**。

\`\`\`js

  console.log(\`Hello, \${name}!\`);
}
hello('世界');
\`\`\`

---

尽情写作吧 —— 内容会自动保存在浏览器本地。`;

/* ============================================================
 *  轻量 GFM 渲染器
 * ============================================================ */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
         .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function inline(src){
  // 先抽出行内代码，避免内部被解析
  const codes = [];
  src = src.replace(/`([^`]+)`/g, (m,c)=>{
    codes.push('<code>'+escapeHtml(c)+'</code>');
    return '\u0000'+(codes.length-1)+'\u0000';
  });
  src = escapeHtml(src);
  // 图片
  src = src.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
    (m,a,u,t)=>`<img src="${u}" alt="${a}"${t?` title="${t}"`:''}>`);
  // 链接
  src = src.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
    (m,t,u,title)=>`<a href="${u}"${title?` title="${title}"`:''} target="_blank" rel="noopener">${t}</a>`);
  // kbd
  src = src.replace(/&lt;([^&<>]{1,20})&gt;/g, (m,k)=> /^[A-Za-z0-9+\- ]+$/.test(k)?`<kbd>${k}</kbd>`:m);
  // 加粗
  src = src.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  src = src.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  // 删除线
  src = src.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // 斜体（避免吞掉已经处理的）
  src = src.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>');
  src = src.replace(/(^|[^_])_([^_\s][^_]*?)_(?!_)/g,'$1<em>$2</em>');
  // 还原行内代码
  src = src.replace(/\u0000(\d+)\u0000/g, (m,i)=>codes[+i]);
  // 换行（行尾两空格）
  src = src.replace(/ {2,}\n/g,'<br>\n');
  return src;
}

function highlightCode(code, lang){
  let out = escapeHtml(code);
  if(!lang) return out;
  const kw = {
    js: /\b(const|let|var|function|return|if|else|for|while|class|new|typeof|import|export|from|default|async|await|try|catch|throw|switch|case|break|continue|of|in|this|null|undefined|true|false)\b/g,
    py: /\b(def|return|if|elif|else|for|while|class|import|from|as|with|try|except|finally|lambda|None|True|False|and|or|not|in|is|pass|yield)\b/g,
    css:/\b(px|em|rem|auto|none|block|flex|grid|absolute|relative|fixed|solid|border|color|background|margin|padding|width|height)\b/g,
  }[lang] || /\b(const|let|var|function|return|if|else|for|while|class|new|import|export|from|default|async|await|try|catch|this|null|true|false)\b/g;
  // 顺序：注释 → 字符串 → 数字 → 关键字
  out = out
    .replace(/(\/\/[^\n]*|#(?!{)[^\n]*)/g,'<span style="color:var(--text-tertiary);font-style:italic">$1</span>')
    .replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g,'<span style="color:#0a3069">'+(document.documentElement.dataset.theme==='dark'||matchMedia('(prefers-color-scheme: dark)').matches?'#a5d6ff':'')+'$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span style="color:#0550ae">'+(document.documentElement.dataset.theme==='dark'||matchMedia('(prefers-color-scheme: dark)').matches?'#79c0ff':'')+'$1</span>')
    .replace(kw,'<span style="color:#cf222e">'+(document.documentElement.dataset.theme==='dark'||matchMedia('(prefers-color-scheme: dark)').matches?'#ff7b72':'')+'$1</span>');
  return out;
}

function isTableDelimiter(line){
  return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
}
function splitRow(line){
  line = line.trim().replace(/^\|/,'').replace(/\|$/,'');
  // 不处理转义竖线 \|
  const cells=[]; let cur='', esc=false;
  for(const ch of line){
    if(esc){ cur+=ch; esc=false; continue; }
    if(ch==='\\'){ cur+=ch; esc=true; continue; }
    if(ch==='|'){ cells.push(cur.trim()); cur=''; continue; }
    cur+=ch;
  }
  cells.push(cur.trim());
  return cells;
}

function renderBlock(src){
  const lines = src.split('\n');
  const html = [];
  let i = 0;
  while(i < lines.length){
    let line = lines[i];

    // 空行
    if(!line.trim()){ i++; continue; }

    // 围栏代码
    const fence = line.match(/^\s*```(\w*)\s*$/);
    if(fence){
      const lang = fence[1];
      const buf = [];
      i++;
      while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; // 跳过结束 ```
      html.push('<pre><code class="language-'+escapeHtml(lang)+'">'+highlightCode(buf.join('\n'),lang)+'\n</code></pre>');
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      const lvl = h[1].length;
      html.push(`<h${lvl}>${inline(h[2])}</h${lvl}>`);
      i++; continue;
    }

    // 分割线
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      html.push('<hr>'); i++; continue;
    }

    // 表格
    if(/^\s*\|/.test(line) && i+1 < lines.length && isTableDelimiter(lines[i+1])){
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i]) && lines[i].trim()){
        rows.push(splitRow(lines[i])); i++;
      }
      let t = '<table><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>';
      for(const r of rows){
        t += '<tr>'+head.map((_,idx)=>`<td>${inline(r[idx]||'')}</td>`).join('')+'</tr>';
      }
      t += '</tbody></table>';
      html.push(t); continue;
    }

    // 引用
    if(/^\s*>/.test(line)){
      const buf=[];
      while(i<lines.length && /^\s*>/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      html.push('<blockquote>'+renderBlock(buf.join('\n'))+'</blockquote>');
      continue;
    }

    // 列表
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      const items=[];
      const re = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;
      while(i<lines.length && re.test(lines[i])){
        const m = lines[i].match(re);
        const indent = m[1].length;
        let content = m[3];
        // 任务列表
        const task = content.match(/^\[([ xX])\]\s+(.*)$/);
        if(task){
          content = `<input type="checkbox" disabled ${task[1].toLowerCase()==='x'?'checked':''}> ${inline(task[2])}`;
        } else {
          content = inline(content);
        }
        // 收集多行延续（缩进行）
        let j = i+1;
        while(j<lines.length && lines[j].trim() && !re.test(lines[j])){
          content += '<br>'+inline(lines[j]); j++;
        }
        items.push({indent, content});
        i = j;
      }
      // 递归处理嵌套（简单版：用缩进转 ul 嵌套）
      let listHtml = '';
      let stack = [0];
      listHtml += ordered?'<ol>':'<ul>';
      for(const it of items){
        while(it.indent < stack[stack.length-1]){ listHtml += ordered?'</ol>':'</ul>'; stack.pop(); }
        if(it.indent > stack[stack.length-1]){ listHtml += '<ul>'; stack.push(it.indent); }
        listHtml += `<li>${it.content}</li>`;
      }
      while(stack.length){ listHtml += ordered?'</ol>':'</ul>'; stack.pop(); }
      html.push(listHtml);
      continue;
    }

    // 普通段落
    const buf=[];
    while(i<lines.length && lines[i].trim() &&
          !/^\s*```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) &&
          !/^\s*>/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
          !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]) &&
          !/^\s*\|/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    if(buf.length){
      html.push('<p>'+inline(buf.join('\n'))+'</p>');
    }
  }
  return html.join('\n');
}

/* ---------------- 渲染主入口 ---------------- */
let renderTimer = null;
function render(){
  const src = editor.value;
  preview.innerHTML = renderBlock(src);
  updateStatus();
  updateGutter();
  autoSave();
}

function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
}

/* ---------------- 行号 ---------------- */
function updateGutter(){
  const lines = editor.value.split('\n').length;
  const cur = gutter.textContent.split('\n').length;
  if(cur === lines) return;
  let out='';
  for(let i=1;i<=lines;i++) out += i+'\n';
  gutter.textContent = out;
}
function syncGutterScroll(){
  gutter.scrollTop = editor.scrollTop;
}

/* ---------------- 状态栏 ---------------- */
function updateStatus(){
  const v = editor.value;
  const lines = v.split('\n').length;
  const chars = v.length;
  const words = (v.match(/[\u4e00-\u9fa5]|[A-Za-z0-9]+/g)||[]).length;
  $('#stLine').textContent = `行 ${lineAt(editor.selectionStart)}, 列 ${colAt(editor.selectionStart)}`;
  $('#stWords').textContent = `${words} 词`;
  $('#stChars').textContent = `${chars} 字符`;
}
function lineAt(pos){ return editor.value.slice(0,pos).split('\n').length; }
function colAt(pos){
  const before = editor.value.slice(0,pos);
  const li = before.lastIndexOf('\n');
  return pos-li;
}

/* ---------------- 自动保存 ---------------- */
let saveTimer=null, dirty=false;
function autoSave(){
  dirty = true;
  $('#stSaved').textContent = '编辑中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(STORAGE_KEY, editor.value);
    dirty=false;
    $('#stSaved').textContent = '已自动保存';
  }, 600);
}

/* ---------------- Toast ---------------- */
let toastTimer=null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------------- 主题 ---------------- */
function applyTheme(mode){
  if(mode === 'auto'){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.dataset.theme = mode; }
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{
    b.classList.toggle('on', b.dataset.themeBtn === mode);
  });
  localStorage.setItem(THEME_KEY, mode);
  // 高亮颜色主题切换后重渲染
  render();
}
document.querySelectorAll('[data-theme-btn]').forEach(b=>{
  b.addEventListener('click', ()=>applyTheme(b.dataset.themeBtn));
});
// 系统主题变化时自动重渲染（auto 模式下 CSS 自动切换，高亮色需手动）
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if(!localStorage.getItem(THEME_KEY) || localStorage.getItem(THEME_KEY)==='auto') render();
});

/* ---------------- 工具栏动作 ---------------- */
function wrapSelection(before, after, placeholder){
  const s = editor.selectionStart, e = editor.selectionEnd;
  const v = editor.value;
  const sel = v.slice(s,e) || placeholder || '';
  const insert = before + sel + after;
  editor.value = v.slice(0,s) + insert + v.slice(e);
  editor.focus();
  if(sel){
    editor.selectionStart = s + before.length;
    editor.selectionEnd = s + before.length + sel.length;
  } else {
    editor.selectionStart = editor.selectionEnd = s + before.length;
  }
  scheduleRender();
}
function prefixLines(prefix){
  const s = editor.selectionStart, e = editor.selectionEnd;
  const v = editor.value;
  const lineStart = v.lastIndexOf('\n', s-1)+1;
  let block = v.slice(lineStart, e);
  // 若光标在行首则扩到当前行
  const selEndLine = v.lastIndexOf('\n', e-1)+1;
  if(e===selEndLine && e>lineStart) block = v.slice(lineStart, e);
  const replaced = block.split('\n').map(l=> prefix + l).join('\n');
  editor.value = v.slice(0,lineStart) + replaced + v.slice(e);
  editor.selectionStart = lineStart;
  editor.selectionEnd = lineStart + replaced.length;
  editor.focus();
  scheduleRender();
}

const ACTIONS = {
  bold:      ()=>wrapSelection('**','**','加粗文本'),
  italic:    ()=>wrapSelection('*','*','斜体文本'),
  strike:    ()=>wrapSelection('~~','~~','删除线'),
  code:      ()=>wrapSelection('`','`','code'),
  codeblock: ()=>{
    const s=editor.selectionStart, e=editor.selectionEnd;
    const v=editor.value;
    const needNL = s>0 && v[s-1]!=='\n' ? '\n' : '';
    const insert = needNL + '```\n' + (v.slice(s,e)||'代码') + '\n```\n';
    editor.value = v.slice(0,s)+insert+v.slice(e);
    editor.selectionStart = editor.selectionEnd = s+needNL.length+4;
    editor.focus();
    scheduleRender();
  },
  link: ()=>{
    const url = prompt('链接地址：','https://') || '';
    if(!url) return;
    wrapSelection('[',`](${url})`, '链接文本');
  },
  image: ()=>{
    const url = prompt('图片地址：','https://') || '';
    if(!url) return;
    wrapSelection('![',`](${url})`, '图片描述');
  },
  h2: ()=>prefixLines('## '),
  quote: ()=>prefixLines('> '),
  ul: ()=>prefixLines('- '),
  ol: ()=>prefixLines('1. '),
  task: ()=>prefixLines('- [ ] '),
  table: ()=>{
    const tbl = '\n| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n| 单元格 | 单元格 | 单元格 |\n| 单元格 | 单元格 | 单元格 |\n';
    const s=editor.selectionStart;
    editor.value = editor.value.slice(0,s) + tbl + editor.value.slice(s);
    editor.selectionStart = editor.selectionEnd = s+tbl.length;
    editor.focus();
    scheduleRender();
  },
  hr: ()=>{
    const s=editor.selectionStart;
    const v=editor.value;
    const needNL = s>0 && v[s-1]!=='\n' ? '\n\n' : '\n';
    editor.value = v.slice(0,s)+needNL+'---\n\n'+v.slice(s);
    scheduleRender();
  },
  clear: ()=>{
    if(confirm('确定清空当前文档？')){
      editor.value=''; editor.focus(); render();
    }
  },
  undo: ()=>editor.execCommand('undo'),
  redo: ()=>editor.execCommand('redo'),
};
document.querySelectorAll('[data-action]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const a = ACTIONS[btn.dataset.action];
    if(a) a();
  });
});

/* ---------------- 快捷键 ---------------- */
editor.addEventListener('keydown', (e)=>{
  const mod = e.ctrlKey || e.metaKey;
  if(!mod) return;
  const k = e.key.toLowerCase();
  const map = {
    b:['bold',[]], i:['italic',[]],
    k:['link',[]],
    y:['redo',[]],
  };
  if(e.shiftKey){
    if(k==='k'){ e.preventDefault(); ACTIONS.code(); }
    else if(k==='c'){ e.preventDefault(); ACTIONS.codeblock(); }
    else if(k==='q'){ e.preventDefault(); ACTIONS.quote(); }
    else if(k==='s'){ e.preventDefault(); ACTIONS.strike(); }
    return;
  }
  if(map[k]){ e.preventDefault(); ACTIONS[map[k][0]](); }
});
// Tab 缩进
editor.addEventListener('keydown', (e)=>{
  if(e.key === 'Tab'){
    e.preventDefault();
    const s=editor.selectionStart, end=editor.selectionEnd;
    editor.value = editor.value.slice(0,s)+'  '+editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = s+2;
    scheduleRender();
  }
});

/* ---------------- 编辑器事件 ---------------- */
editor.addEventListener('input', scheduleRender);
editor.addEventListener('scroll', ()=>{
  syncGutterScroll();
  if(syncScrolling){ syncPreviewScroll(); }
});
editor.addEventListener('keyup', updateStatus);
editor.addEventListener('click', updateStatus);

/* ---------------- 同步滚动 ---------------- */
let syncScrolling = true;
let syncLock = false;
function syncPreviewScroll(){
  if(syncLock) return;
  syncLock = true;
  const ratio = editor.scrollTop / (editor.scrollHeight - editor.clientHeight || 1);
  previewScroll.scrollTop = ratio * (previewScroll.scrollHeight - previewScroll.clientHeight);
  requestAnimationFrame(()=>{ syncLock=false; });
}
previewScroll.addEventListener('scroll', ()=>{
  if(!syncScrolling || syncLock) return;
  syncLock = true;
  const ratio = previewScroll.scrollTop / (previewScroll.scrollHeight - previewScroll.clientHeight || 1);
  editor.scrollTop = ratio * (editor.scrollHeight - editor.clientHeight || 1);
  gutter.scrollTop = editor.scrollTop;
  requestAnimationFrame(()=>{ syncLock=false; });
});
$('#stSync').addEventListener('click', ()=>{
  syncScrolling = !syncScrolling;
  $('#stSync').textContent = '滚动同步：' + (syncScrolling?'开':'关');
});

/* ---------------- 分栏拖动 ---------------- */
const divider = $('#divider');
let dragging=false;
divider.addEventListener('mousedown', ()=>{
  dragging = true; divider.classList.add('drag');
  document.body.style.cursor='col-resize';
});
document.addEventListener('mouseup', ()=>{
  dragging=false; divider.classList.remove('drag');
  document.body.style.cursor='';
});
document.addEventListener('mousemove', (e)=>{
  if(!dragging) return;
  const main = document.querySelector('.main');
  const rect = main.getBoundingClientRect();
  let pct = ((e.clientX - rect.left) / rect.width) * 100;
  pct = Math.max(20, Math.min(80, pct));
  document.querySelector('.pane.editor').style.flex = `0 0 ${pct}%`;
  document.querySelector('.pane.preview').style.flex = `1 1 ${100-pct}%`;
});

/* ---------------- 文件：打开 / 导出 / 复制 ---------------- */
$('#btnOpen').addEventListener('click', ()=>$('#fileInput').click());
$('#fileInput').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    editor.value = reader.result;
    $('#fileName').value = f.name;
    render();
    toast('已打开 '+f.name);
  };
  reader.readAsText(f);
});
$('#btnExport').addEventListener('click', ()=>{
  const name = ($('#fileName').value || 'document').replace(/\.md$/,'') + '.md';
  const blob = new Blob([editor.value], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 '+name);
});
$('#btnCopyHtml').addEventListener('click', async ()=>{
  const html = '<!doctype html><meta charset="utf-8"><title>'+escapeHtml($('#fileName').value||'')+'</title>\n'
    + preview.innerHTML;
  try{
    await navigator.clipboard.writeText(html);
    toast('HTML 已复制到剪贴板');
  }catch(err){
    editor.select(); document.execCommand('copy');
    toast('复制失败，请手动复制');
  }
});
$('#btnPrint').addEventListener('click', ()=>window.print());
$('#fileName').addEventListener('input', ()=>{
  if(!$('#fileName').value.endsWith('.md')) $('#fileName').value += '.md';
});

/* ---------------- 启动 ---------------- */
(function init(){
  const savedTheme = localStorage.getItem(THEME_KEY) || 'auto';
  applyTheme(savedTheme);
  const saved = localStorage.getItem(STORAGE_KEY);
  editor.value = saved != null ? saved : WELCOME;
  render();
  // 移动端：默认预览 tab
  if(window.innerWidth < 721){
    document.body.classList.remove('mode-split');
    document.body.classList.add('mode-split');
  }
})();
</script>
</body>
