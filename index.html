<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云盘空间 · GitHub 版 | Cloud Drive</title>
<style>
  :root {
    --bg:#ffffff; --bg-subtle:#f6f8fa;
    --text:#1f2328; --text-muted:#59636e; --text-subtle:#818b98;
    --border:#d0d7de; --border-muted:#d8dee6;
    --link:#0969da; --link-hover:#0550ae;
    --btn-primary-bg:#1f883d; --btn-primary-hover:#1a7f37;
    --card-bg:#ffffff; --header-bg:#24292f; --header-text:#ffffff;
    --input-bg:#ffffff; --hover-bg:#f3f4f6;
    --danger:#cf222e; --success:#1a7f37;
    --notice-bg:#fff8c5; --notice-border:#d4a72c; --notice-text:#7d4e00;
    --warn-bg:#ffebe9; --warn-border:#ff818266; --warn-text:#cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --bg-subtle:#161b22;
      --text:#e6edf3; --text-muted:#9198a1; --text-subtle:#7d8590;
      --border:#30363d; --border-muted:#21262d;
      --link:#58a6ff; --link-hover:#79c0ff;
      --btn-primary-bg:#238636; --btn-primary-hover:#2ea043;
      --card-bg:#161b22; --header-bg:#010409; --header-text:#e6edf3;
      --input-bg:#0d1117; --hover-bg:#1c2128;
      --danger:#f85149; --success:#3fb950;
      --notice-bg:#3a2d12; --notice-border:#9e6a03; --notice-text:#eac54f;
      --warn-bg:#3d1618; --warn-border:#f8514966; --warn-text:#ff8182;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Microsoft YaHei",Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--bg); min-height:100vh;
    line-height:1.5;
  }
  header {
    background:var(--header-bg); color:var(--header-text);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--border);
  }
  header .brand { display:flex; align-items:center; gap:10px; }
  header .logo { color:var(--header-text); display:flex; }
  header h1 { font-size:18px; font-weight:600; letter-spacing:.2px; }
  header .sub { font-size:12px; opacity:.75; margin-top:2px; }
  .hbtns { display:flex; gap:8px; align-items:center; }
  .btn {
    border:1px solid var(--border); border-radius:6px; padding:6px 14px;
    font-size:13px; cursor:pointer; background:transparent; color:var(--text);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { background:var(--hover-bg); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary {
    background:var(--btn-primary-bg); border-color:rgba(31,35,40,.15); color:#fff; font-weight:600;
    padding:7px 16px;
  }
  .btn-primary:hover { background:var(--btn-primary-hover); }
  .btn-ghost { background:transparent; border-color:var(--border); color:var(--header-text); }
  .btn-ghost:hover { background:rgba(255,255,255,.12); }
  .btn-danger { color:var(--danger); border-color:var(--border); }
  .btn-danger:hover { background:var(--warn-bg); }
  .btn-lang { border-radius:6px; padding:6px 14px; font-weight:600; color:var(--header-text); border-color:var(--border); }
  .wrap { max-width:1080px; margin:24px auto; padding:0 16px; }
  .notice, .warn {
    border-radius:6px; padding:12px 16px; font-size:13px; line-height:1.7; margin-bottom:16px;
    border:1px solid;
  }
  .notice { background:var(--notice-bg); border-color:var(--notice-border); color:var(--notice-text); }
  .warn { background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn-text); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:880px){ .grid { grid-template-columns:1fr; } }
  .card {
    background:var(--card-bg); border:1px solid var(--border); border-radius:6px; padding:20px;
  }
  .card h2 { font-size:16px; margin-bottom:4px; color:var(--text); }
  .card .hint { font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--text-muted); margin:12px 0 6px; font-weight:600; }
  input[type=text], input[type=password] {
    width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px;
    font-size:14px; background:var(--input-bg); color:var(--text); outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus { border-color:var(--link); box-shadow:0 0 0 3px rgba(9,105,218,.25); }
  .drop {
    border:2px dashed var(--border); border-radius:6px; padding:26px; text-align:center;
    color:var(--text-muted); font-size:14px; cursor:pointer; background:var(--bg-subtle);
    margin-top:8px; transition:border-color .15s, background .15s;
  }
  .drop:hover, .drop.on { border-color:var(--link); background:var(--hover-bg); }
  .drop svg { display:block; margin:0 auto 8px; stroke:var(--link); }
  .fileinfo { font-size:13px; color:var(--link); margin-top:8px; word-break:break-all; }
  .status { margin-top:10px; font-size:13px; line-height:1.6; min-height:20px; }
  .status.ok { color:var(--success); } .status.err { color:var(--danger); } .status.info { color:var(--link); }
  .progress { height:6px; background:var(--bg-subtle); border:1px solid var(--border-muted); border-radius:6px; margin-top:10px; overflow:hidden; display:none; }
  .progress > div { height:100%; width:0; background:var(--btn-primary-bg); transition:width .25s ease; }
  .sectabs { display:flex; gap:4px; margin-bottom:14px; border:1px solid var(--border); border-radius:6px; padding:3px; width:max-content; max-width:100%; }
  .sectabs .tab {
    padding:5px 14px; border-radius:4px; font-size:13px; color:var(--text-muted);
    cursor:pointer; transition:all .15s ease; font-weight:600; white-space:nowrap;
  }
  .sectabs .tab:hover { color:var(--text); }
  .sectabs .tab.act { background:var(--hover-bg); color:var(--link); }
  .branch {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; border:1px solid var(--border); border-radius:6px; margin-bottom:8px;
    font-size:14px; cursor:pointer; background:var(--card-bg); transition:background .15s, border-color .15s;
  }
  .branch:hover { background:var(--hover-bg); border-color:var(--link); }
  .branch .who { font-weight:600; color:var(--text); }
  .branch .files { font-size:12px; color:var(--text-subtle); }
  .fileitem {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--border-muted); font-size:13px;
  }
  .fileitem .name { color:var(--text); word-break:break-all; }
  .fileitem a { color:var(--link); text-decoration:none; font-size:13px; white-space:nowrap; font-weight:600; }
  .fileitem a:hover { color:var(--link-hover); text-decoration:underline; }
  .bl { color:var(--link); text-decoration:none; }
  .bl:hover { color:var(--link-hover); text-decoration:underline; }
  .small { font-size:12px; color:var(--text-subtle); line-height:1.6; }
  .empty { text-align:center; color:var(--text-subtle); font-size:13px; padding:26px 0; }
  .accountbar {
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    background:var(--card-bg); border:1px solid var(--border); border-radius:6px; padding:12px 16px;
    margin-bottom:16px;
  }
  .accountbar .who { font-size:14px; color:var(--text); font-weight:600; }
  .accountbar .who .badge {
    display:inline-block; background:var(--bg-subtle); color:var(--text-muted);
    border:1px solid var(--border); font-size:11px; padding:2px 10px; border-radius:999px;
    margin-left:8px; font-weight:600;
  }
  footer { text-align:center; color:var(--text-subtle); font-size:12px; padding:22px 0 30px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">
      <svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M5.45 5.154A4.25 4.25 0 0 0 9.25 7.5h.75a10.017 10.017 0 0 1 4.6 1.088l.284-.887A11.515 11.515 0 0 0 10 6.25V5h.25c.58 0 1.08-.28 1.413-.742l.055-.077A1.25 1.25 0 0 0 10.75 2H7.683a3.5 3.5 0 0 0-2.654 1.288l-.44.52c-.361.426-.137 1.046.26 1.346Z"/>

        <path d="M3.686 9.25H5.75a.75.75 0 0 0 0-1.5H4.416l.57-.72h2.94c.137 0 .27-.023.394-.067.11-.04.215-.09.315-.15.34-.204.61-.545.74-.94l.097-.29.098.288a2.04 2.04 0 0 0 .7.926c.08.051.164.098.252.14.128.068.268.106.414.134.089.017.18.028.272.036h2.006a.75.75 0 1 1 0 1.5h-2.12a4.66 4.66 0 0 1-.81-.072c-.247-.042-.486-.105-.714-.187a3.59 3.59 0 0 1-.55-.262c-.02-.013-.04-.026-.06-.04l.373 1.04a.75.75 0 0 1-.7 1.006H5.392l-.632.797H3.686Z"/>
      </svg>
    </span>
    <div>
      <h1 id="appTitle">云盘空间 · GitHub 版</h1>
      <div class="sub" id="appSub">账号登录 · 每人一个分支空间 · 所有人可上传下载</div>
    </div>
  </div>
  <div class="hbtns">
    <button class="btn btn-lang" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
</header>

<div class="wrap">
  <div class="warn" id="topWarn"></div>
  <div class="notice" id="notice"></div>

  <div class="accountbar" id="accountBar" style="display:none;">
    <div class="who" id="accountWho"></div>
    <button class="btn btn-danger" id="logoutBtn" onclick="logout()" data-i18n="btn_logout">退出</button>
  </div>

  <div class="card" id="authCard" style="max-width:520px;margin:0 auto;">
    <div class="sectabs">
      <span class="tab act" id="tabLogin" onclick="switchAuth('login')" data-i18n="tab_login">登录</span>
      <span class="tab" id="tabReg" onclick="switchAuth('reg')" data-i18n="tab_register">注册</span>
    </div>
    <div class="row">
      <label data-i18n="lbl_uname2">用户名</label>
      <input type="text" id="authUname" placeholder="xiaoming">
    </div>
    <div class="row">
      <label data-i18n="lbl_password">密码</label>
      <input type="password" id="authPass" placeholder="******">
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="authBtn" onclick="doAuth()" data-i18n="btn_login">登录</button>
    </div>
    <div class="status" id="authStatus"></div>
    <div class="small" id="authHelp" style="margin-top:8px;"></div>
  </div>

  <div class="grid" id="mainGrid" style="display:none;margin-top:16px;">
    <div class="card">
      <h2 data-i18n="up_title">上传文件</h2>
      <div class="hint" id="upHint"></div>
      <label data-i18n="lbl_file">选择文件</label>
      <div class="drop" id="drop">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span data-i18n="drop_text">点击选择文件，或把文件拖到这里</span>
      </div>
      <div class="fileinfo" id="fileinfo"></div>
      <div style="margin-top:14px;">
        <button class="btn btn-primary" id="uploadBtn" onclick="doUpload()" data-i18n="btn_upload">开始上传</button>
      </div>
      <div class="status" id="upStatus"></div>
      <div class="progress" id="upProgress"><div></div></div>
    </div>

    <div class="card">
      <h2 data-i18n="browse_title">浏览与下载</h2>
      <div class="hint" data-i18n="browse_hint">每个用户一个分支，点开看文件，直接下载。</div>
      <div class="sectabs">
        <span class="tab act" id="tabBranches" onclick="showBranches()" data-i18n="tab_users">所有用户</span>
        <span class="tab" id="tabFiles" onclick="showFiles()" data-i18n="tab_files">分支文件</span>
      </div>
      <div id="browser"></div>
    </div>
  </div>
</div>

<footer id="footerText"></footer>

      msg_committing:"Committing file to branch {u}…",
      msg_upload_ok:"Uploaded! Saved to branch \"{u}\". Everyone can download it here.",

  function $(id){ return document.getElementById(id); }
  function t(key, vars){
    var s = (I18N[lang] && I18N[lang][key]) || (I18N.zh[key]) || key;
    if(vars){ Object.keys(vars).forEach(function(k){ s = s.replace("{" + k + "}", vars[k]); }); }
    return s;
  }

  function loadLang(){
    try { var s = localStorage.getItem(LANG_KEY); if(s === "en" || s === "zh") lang = s; } catch(e){}
    applyLang();
  }
  function toggleLang(){
    lang = (lang === "zh") ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
    applyLang();
  }
  function applyLang(){
    document.documentElement.lang = lang;
    $("langBtn").textContent = t("btn_lang");
    var els = document.querySelectorAll("[data-i18n]");
    for(var i=0;i<els.length;i++){ els[i].textContent = t(els[i].getAttribute("data-i18n")); }
    $("appTitle").textContent = t("app_title");
    $("appSub").textContent = t("app_sub");
    $("topWarn").innerHTML = t("top_warn");
    $("notice").innerHTML = t("notice");
    $("footerText").textContent = t("footer");
    $("authHelp").textContent = authMode === "login" ? t("auth_help_login") : t("auth_help_reg");
    renderView();
  }

  function loadCfg(){
    cfg = { owner: CONFIG_DEFAULT.owner, repo: CONFIG_DEFAULT.repo, token: CONFIG_DEFAULT.token };
  }
  function hasCfg(){ return !!(cfg.owner && cfg.repo && cfg.token); }

  function api(path, method, body){
    method = method || "GET";
    var opts = {
      method: method,
      headers: { "Authorization":"Bearer " + cfg.token, "Accept":"application/vnd.github+json" }
    };
    if(body !== undefined){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch("https://api.github.com" + path, opts).then(function(res){
      return res.json().then(function(j){
        j.__status = res.status;
        return j;
      });
    });
  }

  function randomSalt(){
    var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    var s = "";
    for(var i=0;i<8;i++){ s += chars.charAt(Math.floor(Math.random()*chars.length)); }
    return s;
  }
  function sha256Hex(str){
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
        var arr = new Uint8Array(buf);
        var hex = "";
        for(var i=0;i<arr.length;i++){ hex += ("0" + arr[i].toString(16)).slice(-2); }
        return hex;
      });
    }
    return Promise.resolve(cyrb53(str).toString(16));
  }
  function cyrb53(str, seed){
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for(var i=0, ch; i<str.length; i++){
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1>>>0);
  }

  function validUname(u){ return /^[A-Za-z0-9_-]{1,20}$/.test(u); }
  function accountPath(u){ return "_accounts/" + encodeURIComponent(u) + ".json"; }

  function switchAuth(mode){
    authMode = mode;
    $("tabLogin").className = "tab" + (mode === "login" ? " act" : "");
    $("tabReg").className = "tab" + (mode === "reg" ? " act" : "");
    $("authBtn").textContent = t(mode === "login" ? "btn_login" : "btn_register");
    $("authHelp").textContent = t(mode === "login" ? "auth_help_login" : "auth_help_reg");
    $("authStatus").className = "status"; $("authStatus").textContent = "";
  }

  function doAuth(){
    var status = $("authStatus");
    status.className = "status"; status.textContent = "";
    if(!hasCfg()){ status.className = "status err"; status.textContent = t("msg_need_config"); return; }
    var u = $("authUname").value.trim();
    var p = $("authPass").value;
    if(!u || !p || !validUname(u)){ status.className = "status err"; status.textContent = t("msg_need_uname_pw"); return; }
    if(authMode === "login"){ login(u, p, status); }
    else { register(u, p, status); }
  }

  function register(u, p, status){
    status.className = "status info"; status.textContent = t("msg_reg_check");
    api("/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + accountPath(u))
      .then(function(r){
        if(r.__status === 200){ throw new Error(t("msg_user_exists")); }
        if(r.__status !== 404){ throw new Error(t("msg_read_fail") + (r.message || r.__status)); }
        status.textContent = t("msg_reg_create");
        var salt = randomSalt();
        return sha256Hex(p + ":" + salt).then(function(hash){
          return api("/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + accountPath(u), "PUT", {
            message: "register " + u,
            content: btoa(unescape(encodeURIComponent(JSON.stringify({ salt: salt, hash: hash }))))
          });
        });
      })
      .then(function(res){
        if(res.__status !== 201 && res.__status !== 200){ throw new Error(t("msg_upload_fail") + (res.message || res.__status)); }
        status.className = "status ok"; status.textContent = t("msg_reg_ok");
        setUser(u);
      })
      .catch(function(e){
        status.className = "status err"; status.textContent = t("msg_err") + e.message;
      });
  }

  function login(u, p, status){
    status.className = "status info"; status.textContent = t("msg_reg_check");
    api("/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + accountPath(u))
      .then(function(r){
        if(r.__status !== 200){ throw new Error(t("msg_login_fail")); }
        var content = "";
        try {
          content = decodeURIComponent(escape(atob(r.content)));
        } catch(e2){
          try { content = atob(r.content); } catch(e3){ content = ""; }
        }
        var data = JSON.parse(content);
        return sha256Hex(p + ":" + data.salt).then(function(hash){
          if(hash !== data.hash) throw new Error(t("msg_login_fail"));
          status.className = "status ok"; status.textContent = t("msg_login_ok");
          setUser(u);
        });
      })
      .catch(function(e){
        status.className = "status err"; status.textContent = t("msg_err") + e.message;
      });
  }

  function setUser(u){
    curUser = u;
    try { sessionStorage.setItem("ghshare_user", u); } catch(e){}
    renderView();
    refreshBranches();
  }
  function logout(){
    curUser = null;
    try { sessionStorage.removeItem("ghshare_user"); } catch(e){}
    renderView();
  }

  function renderView(){
    var logged = !!curUser && hasCfg();
    $("authCard").style.display = logged ? "none" : "block";
    $("mainGrid").style.display = logged ? "grid" : "none";
    $("accountBar").style.display = logged ? "flex" : "none";
    if(logged){
      $("accountWho").innerHTML = t("welcome") + curUser + '<span class="badge">' + curUser + '</span>';
      $("upHint").textContent = t("up_hint", { u: curUser });
      $("authPass").value = "";
      $("authUname").value = "";
    }
  }

  function base64FromFile(file, cb){
    var r = new FileReader();
    r.onload = function(){
      var s = r.result;
      cb(s.slice(s.indexOf(",") + 1));
    };
    r.readAsDataURL(file);
  }

  function doUpload(){
    var status = $("upStatus"), prog = $("upProgress");
    status.className = "status"; status.textContent = "";
    if(!curUser){ status.className = "status err"; status.textContent = t("msg_need_config"); return; }
    if(!pickedFile){ status.className = "status err"; status.textContent = t("msg_need_file"); return; }
    if(pickedFile.size > 100*1024*1024){
      status.className = "status err";
      status.textContent = t("msg_too_big");
      return;
    }
    var uname = curUser;
    var file = pickedFile;
    var path = encodeURIComponent(file.name);
    status.className = "status info";
    status.textContent = t("msg_preparing");
    prog.style.display = "block";
    prog.firstElementChild.style.width = "10%";
    $("uploadBtn").disabled = true;

    function fail(msg){ status.className = "status err"; status.textContent = t("msg_err") + msg; prog.style.display = "none"; $("uploadBtn").disabled = false; }

    api("/repos/" + cfg.owner + "/" + cfg.repo + "/branches/" + encodeURIComponent(uname))
      .then(function(r){
        if(r.__status === 200){
          return Promise.resolve({ exists:true, sha:null });
        }
        if(r.__status === 404){
          return api("/repos/" + cfg.owner + "/" + cfg.repo).then(function(repo){
            if(repo.__status !== 200) throw new Error(t("msg_repo_fail") + (repo.message || repo.__status));
            var def = repo.default_branch;
            return api("/repos/" + cfg.owner + "/" + cfg.repo + "/git/ref/heads/" + def).then(function(ref){
              if(ref.__status !== 200) throw new Error(t("msg_branch_fail") + (ref.message || ref.__status));
              return api("/repos/" + cfg.owner + "/" + cfg.repo + "/git/refs", "POST", {
                ref: "refs/heads/" + uname,
                sha: ref.object.sha
              }).then(function(created){
                if(created.__status !== 201) throw new Error(t("msg_create_branch_fail") + (created.message || created.__status));
                return { exists:true, sha:null };
              });
            });
          });
        }
        throw new Error(t("msg_check_branch_fail") + (r.message || r.__status));
      })
      .then(function(){
        status.textContent = t("msg_branch_ready");
        prog.firstElementChild.style.width = "30%";
        return new Promise(function(res){
          base64FromFile(file, res);
        });
      })
      .then(function(b64){
        status.textContent = t("msg_committing", { u: uname });
        prog.firstElementChild.style.width = "60%";
        return api("/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + path, "PUT", {
          message: "upload " + file.name + " by " + uname,
          content: b64,
          branch: uname
        });
      })
      .then(function(res){
        if(res.__status !== 201 && res.__status !== 200){
          throw new Error(t("msg_upload_fail") + (res.message || res.__status));
        }
        prog.firstElementChild.style.width = "100%";
        status.className = "status ok";
        status.textContent = t("msg_upload_ok", { u: uname });
        setTimeout(function(){ prog.style.display = "none"; prog.firstElementChild.style.width = "0"; }, 1200);
        $("uploadBtn").disabled = false;
        pickedFile = null; $("fileinfo").textContent = "";
        refreshBranches();
      })
      .catch(function(e){
        fail(e.message);
      });
  }

  function refreshBranches(){
    if(!hasCfg()) return;
    var box = $("browser");
    box.innerHTML = '<div class="empty">' + t("msg_loading_users") + '</div>';
    api("/repos/" + cfg.owner + "/" + cfg.repo + "/branches?per_page=100")
      .then(function(res){
        if(res.__status !== 200){ box.innerHTML = '<div class="empty">' + t("msg_read_fail") + (res.message || res.__status) + '</div>'; return; }
        branches = res;
        showBranches();
      })
      .catch(function(e){ box.innerHTML = '<div class="empty">' + t("msg_read_fail") + e.message + '</div>'; });
  }

  function showBranches(){
    $("tabBranches").className = "tab act";
    $("tabFiles").className = "tab";
    var box = $("browser");
    if(!branches.length){ box.innerHTML = '<div class="empty">' + t("msg_no_users") + '</div>'; return; }
    var html = "";
    branches.forEach(function(b){
      html += '<div class="branch" onclick="openBranch(\'' + b.name.replace(/\\/g,"\\\\").replace(/'/g,"\\'") + '\')">'
            + '<span class="who">' + b.name + '</span>'
            + '<span class="files">' + t("msg_open") + '</span></div>';
    });
    box.innerHTML = html;
  }

  function openBranch(bname){
    $("tabBranches").className = "tab";
    $("tabFiles").className = "tab act";
    var box = $("browser");
    box.innerHTML = '<div class="empty">' + t("msg_loading_files", { b: bname }) + '</div>';
    api("/repos/" + cfg.owner + "/" + cfg.repo + "/git/trees/" + encodeURIComponent(bname) + "?recursive=1")
      .then(function(res){
        if(res.__status !== 200){ box.innerHTML = '<div class="empty">' + t("msg_read_fail") + (res.message || res.__status) + '</div>'; return; }
        var files = (res.tree || []).filter(function(t){ return t.type === "blob"; });
        if(!files.length){
          box.innerHTML = '<div class="empty">' + t("msg_no_files") + '<br><span style="font-size:12px"><a href="javascript:showBranches()" class="bl">' + t("back") + '</a></span></div>';
          return;
        }
        var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
                 + '<strong style="font-size:14px">' + t("files_count", { b: bname, n: files.length }) + '</strong>'
                 + '<a href="javascript:showBranches()" class="bl" style="font-size:13px">' + t("back") + '</a></div>';
        files.forEach(function(f){
          var dl = "https://raw.githubusercontent.com/" + cfg.owner + "/" + cfg.repo + "/" + encodeURIComponent(bname) + "/" + f.path.split("/").map(encodeURIComponent).join("/");
          html += '<div class="fileitem"><span class="name">' + f.path + '</span>'
                + '<a href="' + dl + '" target="_blank" rel="noopener">' + t("download") + '</a></div>';
        });
        box.innerHTML = html;
      })
      .catch(function(e){ box.innerHTML = '<div class="empty">' + t("msg_read_fail") + e.message + '</div>'; });
  }

  function showFiles(){
    if(!branches.length){ showBranches(); return; }
    showBranches();
  }

  function setupDrop(){
    var drop = $("drop");
    drop.addEventListener("click", function(){ $("fileInput").click(); });
    ["dragenter","dragover"].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("on"); });
    });
    ["dragleave","drop"].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("on"); });
    });
    drop.addEventListener("drop", function(e){
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f){ pickedFile = f; $("fileinfo").textContent = t("file_selected") + f.name + "（" + fmtSize(f.size) + "）"; }
    });
    var fi = document.createElement("input");
    fi.type = "file"; fi.id = "fileInput"; fi.style.display = "none";
    fi.addEventListener("change", function(){
      if(fi.files && fi.files[0]){ pickedFile = fi.files[0]; $("fileinfo").textContent = t("file_selected") + pickedFile.name + "（" + fmtSize(pickedFile.size) + "）"; }
    });
    document.body.appendChild(fi);
  }
  function fmtSize(n){
    if(n < 1024) return n + " B";
    if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
    return (n/1024/1024).toFixed(1) + " MB";
  }

  window.toggleLang = toggleLang;
  window.switchAuth = switchAuth;
  window.doAuth = doAuth;
  window.logout = logout;
  window.doUpload = doUpload;
  window.showBranches = showBranches;
  window.showFiles = showFiles;
  window.openBranch = openBranch;

  loadCfg();
  loadLang();
  setupDrop();
  var savedUser = null;
  try { savedUser = sessionStorage.getItem("ghshare_user"); } catch(e){}
  if(savedUser) curUser = savedUser;
  renderView();
  if(hasCfg()) refreshBranches();
})();
</script>
</body>
</html>
